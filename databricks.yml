bundle:
  name: databricks_ecommerce_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the deployment environment
    default: de_dev

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: de_dev

  test:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: de_test

  stage:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: de_stage

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: de_prod